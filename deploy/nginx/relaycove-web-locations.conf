location = /relaycove-web {
    return 308 /relaycove-web/;
}

location ^~ /relaycove-web/assets/ {
    root /opt/relaycove-web/current;
    try_files $uri =404;

    include /etc/nginx/snippets/relaycove-web-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /relaycove-web/ {
    root /opt/relaycove-web/current;
    try_files $uri $uri/ /relaycove-web/index.html;

    include /etc/nginx/snippets/relaycove-web-security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
