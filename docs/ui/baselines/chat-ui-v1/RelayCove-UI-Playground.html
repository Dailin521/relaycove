    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

}

b,

}

}

.table :is(th, td):last-child {

  corner-shape: superellipse(1.5);

  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  top: 0;
  left: 0;

  background: var(--popover);

  flex-direction: column;
  gap: 2px;

}

  height: 1px;

  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    #relaycove-interactive-review:has(.rc-window[data-theme=&quot;light&quot;]) { color-scheme: light; --rc-ground:#f4f4f5; --rc-surface:#fff; --rc-text:#202124; --rc-muted:#74777d; --rc-tertiary:#a0a3a8; --rc-border:#e1e2e4; --rc-strong-border:#cfd2d6; --rc-danger:#c9362b; }
    #relaycove-interactive-review:has(.rc-window[data-theme=&quot;dark&quot;]) { color-scheme: dark; --rc-ground:#17181b; --rc-surface:#202125; --rc-text:#f3f3f4; --rc-muted:#a7a9af; --rc-tertiary:#797c83; --rc-border:#34363c; --rc-strong-border:#4a4d55; --rc-danger:#ff9189; }
    #relaycove-interactive-review [hidden] { display: none !important; }
    #relaycove-interactive-review .viz-controls { margin-bottom: 10px; align-items: end; }
    #relaycove-interactive-review .viz-controls .form-label { min-width: 140px; flex: 1 1 140px; }
    #relaycove-interactive-review .rc-spec { min-height: 1.4em; margin: 0 0 10px; }
    #relaycove-interactive-review .rc-window,
    #relaycove-interactive-review .rc-window * { box-sizing: border-box; }
    #relaycove-interactive-review .rc-window {
      --rc-ground: light-dark(#f4f4f5, #17181b);
      --rc-surface: light-dark(#ffffff, #202125);
      --rc-list: light-dark(#fafafa, #1c1d20);
      --rc-sidebar: light-dark(#f3f3f3, #18191c);
      --rc-hover: light-dark(#f0f1f2, #292a2f);
      --rc-selected: light-dark(#e9edf2, #303238);
      --rc-bubble: light-dark(#f3f4f5, #2a2b30);
      --rc-own-bubble: color-mix(in srgb, var(--rc-accent) 12%, var(--rc-surface));
      --rc-text: light-dark(#202124, #f3f3f4);
      --rc-muted: light-dark(#74777d, #a7a9af);
      --rc-tertiary: light-dark(#a0a3a8, #797c83);
      --rc-border: light-dark(#e1e2e4, #34363c);
      --rc-strong-border: light-dark(#cfd2d6, #4a4d55);
      --rc-danger: light-dark(#c9362b, #ff9189);
      --rc-danger-bg: light-dark(#fff0ee, #3b2224);
      --rc-warning: light-dark(#94600a, #ffc66c);
      --rc-warning-bg: light-dark(#fff6e5, #3a2d1b);
      --rc-success: light-dark(#168554, #66dca7);
      --rc-unread: light-dark(#fa5151, #ff6868);
      position: relative; width: 100%; overflow: hidden;
      border: 1px solid var(--rc-border); border-radius: calc(var(--rc-radius) + 2px);
      background: var(--rc-ground); color: var(--rc-text);
      font-family: Inter, &quot;Segoe UI Variable&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif;
      font-size: var(--rc-font-size);
      box-shadow: 0 16px 38px light-dark(rgb(18 24 32 / 10%), rgb(0 0 0 / 34%));
    }
    #relaycove-interactive-review .rc-window[data-theme=&quot;light&quot;] { color-scheme: light; --rc-ground:#f4f4f5; --rc-surface:#fff; --rc-list:#fafafa; --rc-sidebar:#f3f3f3; --rc-hover:#f0f1f2; --rc-selected:#e9edf2; --rc-bubble:#f3f4f5; --rc-text:#202124; --rc-muted:#74777d; --rc-tertiary:#a0a3a8; --rc-border:#e1e2e4; --rc-strong-border:#cfd2d6; --rc-danger:#c9362b; --rc-danger-bg:#fff0ee; --rc-warning:#94600a; --rc-warning-bg:#fff6e5; --rc-success:#168554; --rc-unread:#fa5151; }
    #relaycove-interactive-review .rc-window[data-theme=&quot;dark&quot;] { color-scheme: dark; --rc-ground:#17181b; --rc-surface:#202125; --rc-list:#1c1d20; --rc-sidebar:#18191c; --rc-hover:#292a2f; --rc-selected:#303238; --rc-bubble:#2a2b30; --rc-text:#f3f3f4; --rc-muted:#a7a9af; --rc-tertiary:#797c83; --rc-border:#34363c; --rc-strong-border:#4a4d55; --rc-danger:#ff9189; --rc-danger-bg:#3b2224; --rc-warning:#ffc66c; --rc-warning-bg:#3a2d1b; --rc-success:#66dca7; --rc-unread:#ff6868; }
    #relaycove-interactive-review button,
    #relaycove-interactive-review input,
    #relaycove-interactive-review select,
    #relaycove-interactive-review textarea { font: inherit; }
    #relaycove-interactive-review button { color: inherit; }
    #relaycove-interactive-review .rc-titlebar { height: 40px; display: flex; align-items: center; gap: 8px; padding-left: 11px; border-bottom: 1px solid var(--rc-border); background: var(--rc-ground); user-select: none; }
    #relaycove-interactive-review .rc-app-icon { width: 24px; height: 24px; display: inline-grid; place-items: center; flex: 0 0 24px; border-radius: 7px; background: var(--rc-accent); color: white; font-weight: 500; }
    #relaycove-interactive-review .rc-app-name { font-weight: 500; }
    #relaycove-interactive-review .rc-workspace { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px; border: 0; border-radius: 6px; background: transparent; color: var(--rc-muted); cursor: pointer; }
    #relaycove-interactive-review .rc-workspace:hover { background: var(--rc-hover); color: var(--rc-text); }
    #relaycove-interactive-review .rc-workspace svg { width: 13px; height: 13px; }
    #relaycove-interactive-review .rc-title-drag { flex: 1; align-self: stretch; }
    #relaycove-interactive-review .rc-window-actions { height: 100%; display: flex; margin-left: auto; }
    #relaycove-interactive-review .rc-window-actions button { width: 46px; height: 100%; display: grid; place-items: center; border: 0; border-radius: 0; background: transparent; color: var(--rc-muted); cursor: pointer; }
    #relaycove-interactive-review .rc-window-actions button:hover,

      function updateUnreadBadges() {
        Object.entries(conversations).forEach(([id,conversation]) =&gt; {
          const meta = root.querySelector(`[data-chat=&quot;${id}&quot;] .rc-session-meta`);
          if (!meta) return;
          let badge = meta.querySelector(&#x27;b&#x27;);
          const unread = Math.max(0,Number(conversation.unread) || 0);
          if (!unread) {
            if (badge) badge.remove();
            return;
          }
          if (!badge) {
            badge = document.createElement(&#x27;b&#x27;);
            meta.append(badge);
          }
          badge.textContent = unread &gt; 99 ? &#x27;99+&#x27; : String(unread);
          badge.setAttribute(&#x27;aria-label&#x27;,`${unread} 条未读消息`);
        });
        const total = Object.values(conversations).reduce((sum,conversation) =&gt; sum + Math.max(0,Number(conversation.unread) || 0),0);
        const messageRail = root.querySelector(&#x27;[data-section=&quot;messages&quot;]&#x27;);
        let railBadge = messageRail.querySelector(&#x27;b&#x27;);
        if (!total) {
          if (railBadge) railBadge.remove();
          return;
        }
        if (!railBadge) {
          railBadge = document.createElement(&#x27;b&#x27;);
          messageRail.append(railBadge);
        }
        railBadge.textContent = total &gt; 99 ? &#x27;99+&#x27; : String(total);
        railBadge.setAttribute(&#x27;aria-label&#x27;,`${total} 条未读消息`);
      }

        root.querySelector(&#x27;#rc-list-value&#x27;).textContent = controls.list.value + &#x27; px&#x27;;
        root.querySelector(&#x27;#rc-font-value&#x27;).textContent = controls.font.value + &#x27; px&#x27;;
        root.querySelector(&#x27;#rc-radius-value&#x27;).textContent = controls.radius.value + &#x27; px&#x27;;
        root.querySelector(&#x27;#rc-settings-theme&#x27;).value = controls.theme.value;
        root.querySelector(&#x27;#rc-settings-density&#x27;).value = controls.density.value;
        root.querySelector(&#x27;#rc-settings-font&#x27;).value = controls.font.value;
        root.querySelector(&#x27;#rc-settings-list&#x27;).value = controls.list.value;
        root.querySelector(&#x27;#rc-settings-details&#x27;).checked = controls.details.checked;
        root.querySelector(&#x27;#rc-settings-font-value&#x27;).textContent = controls.font.value + &#x27; px&#x27;;
        root.querySelector(&#x27;#rc-settings-list-value&#x27;).textContent = controls.list.value + &#x27; px&#x27;;
        spec.textContent = `交互审查 · ${controls.theme.options[controls.theme.selectedIndex].text} · ${controls.density.options[controls.density.selectedIndex].text} · 会话栏 ${controls.list.value} · 字号 ${controls.font.value} · 圆角 ${controls.radius.value}`;
      }

      function selectConversation(id) {
        if (!conversations[id]) return;
        closeTransientMenus();
        const previousChat = currentChat;
        if (conversations[previousChat]) drafts[previousChat] = { text:composer.value, image:attachmentDraft ? { ...attachmentDraft } : null };
        if (pendingSend &amp;&amp; pendingSend.targetChat === previousChat) pendingMessage = null;
        currentChat = id;
        currentSection = &#x27;messages&#x27;;
        showWorkspaceView();
        root.querySelectorAll(&#x27;[data-section]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-active&#x27;, button.dataset.section === &#x27;messages&#x27;));
        root.querySelectorAll(&#x27;[data-list]&#x27;).forEach(panel =&gt; panel.hidden = panel.dataset.list !== &#x27;messages&#x27;);
        searchInput.value = &#x27;&#x27;;
        searchInput.placeholder = &#x27;搜索会话、成员和消息&#x27;;
        filterList(&#x27;&#x27;);
        root.querySelectorAll(&#x27;[data-chat]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-active&#x27;, button.dataset.chat === id));
        const conversation = conversations[id];
        conversation.unread = 0;
        updateUnreadBadges();
        const draft = drafts[id] || { text:&#x27;&#x27;, image:null };
        composer.value = draft.text;
        attachmentDraft = draft.image ? { ...draft.image } : null;
        renderAttachmentDraft();
        root.querySelector(&#x27;#rc-chat-title&#x27;).textContent = conversation.title;
        root.querySelector(&#x27;#rc-chat-subtitle&#x27;).textContent = conversation.type === &#x27;channel&#x27; ? channelSubtitle(conversation) : conversation.subtitle;
        composer.placeholder = conversation.type === &#x27;dm&#x27; ? `发送给 ${conversation.title.replace(&#x27;（自己）&#x27;,&#x27;&#x27;)}` : `发送到 ${conversation.title}`;
        closeMentionPicker();
        pendingMessage = pendingSend &amp;&amp; pendingSend.targetChat === id ? pendingSend.outgoing : null;
        controls.state.value = &#x27;normal&#x27;;
        applyState();
        renderDetails();
        if (matchMedia(&#x27;(max-width: 720px)&#x27;).matches) shell.classList.add(&#x27;is-chat-open&#x27;);
      }

      function showWorkspaceView() {
        root.querySelector(&#x27;.rc-settings-view&#x27;).hidden = true;
        root.querySelector(&#x27;.rc-session-pane&#x27;).hidden = false;
        root.querySelector(&#x27;.rc-chat&#x27;).hidden = false;
        applyLayout();
      }

      function showSection(name) {
        closeTransientMenus();
        currentSection = name;
        root.querySelectorAll(&#x27;[data-section]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-active&#x27;, button.dataset.section === name));
        if (name === &#x27;settings&#x27;) {
          root.querySelector(&#x27;.rc-session-pane&#x27;).hidden = true;
          root.querySelector(&#x27;.rc-chat&#x27;).hidden = true;
          root.querySelector(&#x27;.rc-settings-view&#x27;).hidden = false;
          win.classList.remove(&#x27;show-details&#x27;);
          return;
        }
        showWorkspaceView();
        root.querySelectorAll(&#x27;[data-list]&#x27;).forEach(panel =&gt; panel.hidden = panel.dataset.list !== name);
        searchInput.value = &#x27;&#x27;;
        searchInput.placeholder = name === &#x27;contacts&#x27; ? &#x27;搜索成员&#x27; : name === &#x27;saved&#x27; ? &#x27;搜索已保存消息&#x27; : &#x27;搜索会话、成员和消息&#x27;;
        filterList(&#x27;&#x27;);
      }

      function filterList(query) {
        const panel = root.querySelector(`[data-list=&quot;${currentSection}&quot;]`);
        if (!panel) return;
        const needle = query.trim().toLowerCase();
        panel.querySelectorAll(&#x27;[data-search]&#x27;).forEach(item =&gt; item.hidden = !item.dataset.search.toLowerCase().includes(needle));
        panel.querySelectorAll(&#x27;.rc-conversation-group&#x27;).forEach(group =&gt; {
          const items = [...group.querySelectorAll(&#x27;[data-search]&#x27;)];
          group.classList.toggle(&#x27;is-empty&#x27;, items.length &gt; 0 &amp;&amp; items.every(item =&gt; item.hidden));
        });
      }

      function normalize(value) {
        return String(value || &#x27;&#x27;).trim().toLocaleLowerCase();
      }

      function highlightMatch(text, query) {
        const value = String(text || &#x27;&#x27;);
        const needle = normalize(query);
        if (!needle) return escapeHtml(value);
        const lower = value.toLocaleLowerCase();
        let cursor = 0;
        let html = &#x27;&#x27;;
        let index = lower.indexOf(needle);
        while (index !== -1) {
          html += escapeHtml(value.slice(cursor,index));
          html += `&lt;mark class=&quot;rc-search-match&quot;&gt;${escapeHtml(value.slice(index,index + needle.length))}&lt;/mark&gt;`;
          cursor = index + needle.length;
          index = lower.indexOf(needle,cursor);
        }
        return html + escapeHtml(value.slice(cursor));
      }

      function buildSearchIndex() {
        const searchableContent = item =&gt; item.messages.filter(message =&gt; !message.kind).flatMap(message =&gt; [
          message.text ? { type:&#x27;message&#x27;, value:message.text } : null,
          message.image?.name ? { type:&#x27;attachment&#x27;, value:message.image.name } : null
        ].filter(Boolean));
        const channelItems = Object.entries(conversations).filter(([,item]) =&gt; item.type === &#x27;channel&#x27;).map(([id,item]) =&gt; { const content = searchableContent(item); return { kind:&#x27;channel&#x27;, id, title:item.title, subtitle:`# ${item.channelName} · ${item.topic} · ${item.members.length} 位成员`, searchContent:content, terms:`${item.title} ${item.channelName} ${item.topic} ${item.members.map(memberId =&gt; people[memberId].name).join(&#x27; &#x27;)} ${content.map(entry =&gt; entry.value).join(&#x27; &#x27;)}` }; });
        const dmItems = Object.entries(conversations).filter(([,item]) =&gt; item.type === &#x27;dm&#x27;).map(([id,item]) =&gt; { const content = searchableContent(item); return { kind:&#x27;dm&#x27;, id, person:item.person, title:item.title, subtitle:`${people[item.person].role} · ${people[item.person].status}`, searchContent:content, terms:`${item.title} ${people[item.person].role} ${people[item.person].status} ${id} ${content.map(entry =&gt; entry.value).join(&#x27; &#x27;)}` }; });
        const memberItems = Object.entries(people).map(([id,person]) =&gt; ({ kind:&#x27;member&#x27;, id, person:id, title:person.name, subtitle:`成员 · ${person.role} · ${person.status}`, terms:`${person.name} ${person.role} ${person.status} ${id}` }));
        return [...dmItems,...channelItems,...memberItems];
      }

      function searchItemAvatar(item) {
        if (item.kind === &#x27;channel&#x27;) return `&lt;span class=&quot;rc-session-avatar rc-stream-avatar&quot;&gt;#&lt;/span&gt;`;
        return avatarHtml(item.person,&#x27;rc-session-avatar&#x27;);
      }

      function searchItemSubtitle(item,query) {
        if (!query || normalize(`${item.title} ${item.subtitle}`).includes(normalize(query))) return item.subtitle;
        const match = (item.searchContent || []).find(entry =&gt; normalize(entry.value).includes(normalize(query)));
        return match ? `${match.type === &#x27;attachment&#x27; ? &#x27;附件&#x27; : &#x27;消息&#x27;}：${match.value}` : item.subtitle;
      }

      function renderGlobalSearch() {
        const query = searchInput.value.trim();
        const allItems = buildSearchIndex();
        searchItems = query ? allItems.filter(item =&gt; normalize(`${item.title} ${item.subtitle} ${item.terms}`).includes(normalize(query))) : allItems.slice(0,9);
        const order = [&#x27;dm&#x27;,&#x27;channel&#x27;,&#x27;member&#x27;];
        const labels = { dm:&#x27;私信&#x27;, channel:&#x27;频道&#x27;, member:&#x27;成员&#x27; };
        searchItems.sort((a,b) =&gt; order.indexOf(a.kind) - order.indexOf(b.kind));
        searchActiveIndex = Math.min(searchActiveIndex,Math.max(0,searchItems.length - 1));
        root.querySelector(&#x27;#rc-search-summary&#x27;).textContent = query ? `“${query}”的匹配结果` : &#x27;最近会话与成员&#x27;;
        if (!searchItems.length) {
          searchResults.innerHTML = `&lt;div class=&quot;rc-search-empty&quot;&gt;&lt;strong&gt;没有匹配结果&lt;/strong&gt;&lt;span&gt;可搜索部分名称、频道、成员或单个数字&lt;/span&gt;&lt;/div&gt;`;
          searchInput.removeAttribute(&#x27;aria-activedescendant&#x27;);
          return;
        }
        let flatIndex = 0;
        searchResults.innerHTML = order.map(kind =&gt; {
          const group = searchItems.filter(item =&gt; item.kind === kind);
          if (!group.length) return &#x27;&#x27;;
          const rows = group.map(item =&gt; {
            const index = flatIndex++;
            const visibleSubtitle = searchItemSubtitle(item,query);
            return `&lt;button type=&quot;button&quot; id=&quot;rc-search-option-${index}&quot; class=&quot;rc-search-result ${index === searchActiveIndex ? &#x27;is-active&#x27; : &#x27;&#x27;}&quot; data-search-index=&quot;${index}&quot; role=&quot;option&quot; aria-selected=&quot;${index === searchActiveIndex}&quot;&gt;${searchItemAvatar(item)}&lt;span&gt;&lt;strong&gt;${highlightMatch(item.title,query)}&lt;/strong&gt;&lt;small&gt;${highlightMatch(visibleSubtitle,query)}&lt;/small&gt;&lt;/span&gt;&lt;em&gt;${labels[item.kind]}&lt;/em&gt;&lt;/button&gt;`;
          }).join(&#x27;&#x27;);
          return `&lt;div class=&quot;rc-search-group-title&quot;&gt;&lt;span&gt;${labels[kind]}&lt;/span&gt;&lt;span&gt;${group.length}&lt;/span&gt;&lt;/div&gt;${rows}`;
        }).join(&#x27;&#x27;);
        searchInput.setAttribute(&#x27;aria-activedescendant&#x27;,`rc-search-option-${searchActiveIndex}`);
        searchResults.querySelectorAll(&#x27;[data-search-index]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;mouseenter&#x27;,() =&gt; setSearchActive(Number(button.dataset.searchIndex)));
          button.addEventListener(&#x27;mousedown&#x27;,event =&gt; event.preventDefault());
          button.addEventListener(&#x27;click&#x27;,() =&gt; openSearchItem(Number(button.dataset.searchIndex)));
        });
        iconRefresh();
      }

      function openGlobalSearch() {
        closeTransientMenus(&#x27;search&#x27;);
        searchPopover.hidden = false;
        searchInput.setAttribute(&#x27;aria-expanded&#x27;,&#x27;true&#x27;);
        renderGlobalSearch();
      }

      function closeGlobalSearch() {
        searchPopover.hidden = true;
        searchInput.setAttribute(&#x27;aria-expanded&#x27;,&#x27;false&#x27;);
        searchInput.removeAttribute(&#x27;aria-activedescendant&#x27;);
      }

      function setSearchActive(index) {
        if (!searchItems.length) return;
        searchActiveIndex = Math.max(0,Math.min(index,searchItems.length - 1));
        searchResults.querySelectorAll(&#x27;[data-search-index]&#x27;).forEach(button =&gt; {
          const active = Number(button.dataset.searchIndex) === searchActiveIndex;
          button.classList.toggle(&#x27;is-active&#x27;,active);
          button.setAttribute(&#x27;aria-selected&#x27;,String(active));
          if (active) button.scrollIntoView({ block:&#x27;nearest&#x27; });
        });
        searchInput.setAttribute(&#x27;aria-activedescendant&#x27;,`rc-search-option-${searchActiveIndex}`);
      }

      function openSearchItem(index) {
        const item = searchItems[index];
        if (!item) return;
        closeGlobalSearch();
        selectConversation(item.kind === &#x27;channel&#x27; ? item.id : item.person);
      }

      function getMentionContext() {
        if (conversations[currentChat].type !== &#x27;channel&#x27;) return null;
        const cursor = composer.selectionStart;
        const before = composer.value.slice(0,cursor);
        const match = before.match(/(^|\s)@([^\s@]*)$/u);
        if (!match) return null;
        return { start:cursor - match[2].length - 1, end:cursor, query:match[2] };
      }

      function renderMentionPicker() {
        mentionContext = getMentionContext();
        if (!mentionContext) { closeMentionPicker(); return; }
        closeTransientMenus(&#x27;mention&#x27;);
        const members = conversations[currentChat].members.map(id =&gt; ({ id,...people[id] }));
        mentionItems = members.filter(person =&gt; normalize(`${person.name} ${person.id}`).includes(normalize(mentionContext.query)));
        mentionActiveIndex = Math.min(mentionActiveIndex,Math.max(0,mentionItems.length - 1));
        mentionPicker.innerHTML = `&lt;span&gt;仅当前频道成员&lt;/span&gt;${mentionItems.length ? mentionItems.map((person,index) =&gt; `&lt;button type=&quot;button&quot; class=&quot;${index === mentionActiveIndex ? &#x27;is-active&#x27; : &#x27;&#x27;}&quot; data-mention-index=&quot;${index}&quot; role=&quot;option&quot; aria-selected=&quot;${index === mentionActiveIndex}&quot;&gt;${avatarHtml(person.id,&#x27;rc-session-avatar&#x27;)}&lt;span&gt;&lt;strong&gt;${highlightMatch(person.name,mentionContext.query)}&lt;/strong&gt;&lt;small&gt;${escapeHtml(person.role)}&lt;/small&gt;&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;) : `&lt;span&gt;没有匹配成员&lt;/span&gt;`}`;
        mentionPicker.hidden = false;
        mentionPicker.querySelectorAll(&#x27;[data-mention-index]&#x27;).forEach(button =&gt; {
          button.addEventListener(&#x27;mousedown&#x27;,event =&gt; event.preventDefault());
          button.addEventListener(&#x27;click&#x27;,() =&gt; insertMention(Number(button.dataset.mentionIndex)));
        });
        iconRefresh();
      }

      function closeMentionPicker() {
        mentionPicker.hidden = true;
        mentionItems = [];
        mentionContext = null;
      }

      function setMentionActive(index) {
        if (!mentionItems.length) return;
        mentionActiveIndex = Math.max(0,Math.min(index,mentionItems.length - 1));
        mentionPicker.querySelectorAll(&#x27;[data-mention-index]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-active&#x27;,Number(button.dataset.mentionIndex) === mentionActiveIndex));
      }

      function insertMention(index) {
        const person = mentionItems[index];
        if (!person || !mentionContext) return;
        const insertion = `@${person.name} `;
        composer.setRangeText(insertion,mentionContext.start,mentionContext.end,&#x27;end&#x27;);
        closeMentionPicker();
        updateSendButton();
        composer.focus();
      }

      function clearAttachment() {
        attachmentDraft = null;
        const attachment = root.querySelector(&#x27;#rc-attachment&#x27;);
        attachment.hidden = true;
        root.querySelector(&#x27;#rc-file-input&#x27;).value = &#x27;&#x27;;
        root.querySelector(&#x27;#rc-attachment-preview&#x27;).removeAttribute(&#x27;src&#x27;);
        updateSendButton();
      }

      function renderAttachmentDraft() {
        const attachment = root.querySelector(&#x27;#rc-attachment&#x27;);
        if (!attachmentDraft) {
          attachment.hidden = true;
          root.querySelector(&#x27;#rc-attachment-preview&#x27;).removeAttribute(&#x27;src&#x27;);
          updateSendButton();
          return;
        }
        root.querySelector(&#x27;#rc-attachment-preview&#x27;).src = attachmentDraft.src;
        root.querySelector(&#x27;#rc-attachment-name&#x27;).textContent = attachmentDraft.name;
        root.querySelector(&#x27;#rc-attachment-meta&#x27;).textContent = attachmentDraft.meta || &#x27;图片&#x27;;
        attachment.hidden = false;
        updateSendButton();
      }

      function formatBytes(bytes) {
        if (bytes &lt; 1024) return `${bytes} B`;
        if (bytes &lt; 1048576) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1048576).toFixed(1)} MB`;
      }

      function openImageViewer(button) {
        imageViewerSource = button;
        const viewer = root.querySelector(&#x27;#rc-image-viewer&#x27;);
        const img = root.querySelector(&#x27;#rc-image-viewer-img&#x27;);
        const sample = root.querySelector(&#x27;#rc-image-viewer-sample&#x27;);
        const isSample = button.dataset.imageKind === &#x27;sample&#x27;;
        root.querySelector(&#x27;#rc-image-viewer-name&#x27;).textContent = button.dataset.imageName || &#x27;图片预览&#x27;;
        img.hidden = isSample;
        sample.hidden = !isSample;
        if (!isSample) img.src = button.dataset.imageSrc;
        viewer.hidden = false;
        root.querySelector(&#x27;#rc-image-viewer-close&#x27;).focus();
      }

      function closeImageViewer() {
        root.querySelector(&#x27;#rc-image-viewer&#x27;).hidden = true;
        if (imageViewerSource) imageViewerSource.focus();
        imageViewerSource = null;
      }

      function refreshChannelPresentation(chatId) {
        const conversation = conversations[chatId];
        if (!conversation) return;
        const row = root.querySelector(`[data-chat=&quot;${chatId}&quot;]`);
        if (row) {
          row.dataset.search = `${conversation.channelName} ${conversation.title} ${conversation.topic} ${conversation.members.map(id =&gt; people[id].name).join(&#x27; &#x27;)}`;
          const label = row.querySelector(&#x27;.rc-session-copy strong&#x27;);
          const secondary = row.querySelector(&#x27;.rc-session-copy small&#x27;);
          if (label) label.textContent = conversation.title;
          if (secondary) secondary.textContent = `# ${conversation.channelName} · ${conversation.topic}`;
        }
        if (currentChat === chatId) {
          root.querySelector(&#x27;#rc-chat-subtitle&#x27;).textContent = channelSubtitle(conversation);
          renderDetails();
        }
      }

      function removeChannel(chatId,message) {
        const row = root.querySelector(`[data-chat=&quot;${chatId}&quot;]`);
        if (row) row.remove();
        delete conversations[chatId];
        updateUnreadBadges();
        const channelCount = root.querySelectorAll(&#x27;[data-group=&quot;channels&quot;] [data-chat]&#x27;).length;
        const count = root.querySelector(&#x27;[data-group=&quot;channels&quot;] .rc-group-label small&#x27;);
        if (count) count.textContent = channelCount;
        const fallback = Object.keys(conversations)[0];
        if (fallback) selectConversation(fallback);
        toast(message);
      }

      function handleChannelAction(action) {
        const chatId = currentChat;
        const conversation = conversations[chatId];
        if (!conversation || conversation.type !== &#x27;channel&#x27;) return;
        if (action === &#x27;rename&#x27;) {
          openDialog(&#x27;重命名频道&#x27;,`修改 # ${conversation.channelName} 的频道名称。`,&#x27;保存&#x27;,value =&gt; {
            conversation.channelName = value.trim();
            refreshChannelPresentation(chatId);
            toast(&#x27;频道已重命名（原型）&#x27;);
          },false,{ label:&#x27;新频道名称&#x27;, value:conversation.channelName, required:true });
        }
        if (action === &#x27;delete&#x27;) {
          openDialog(`删除 # ${conversation.channelName}？`,&#x27;频道将从当前原型中移除。此危险操作不会自动撤销。&#x27;,&#x27;删除频道&#x27;,() =&gt; removeChannel(chatId,&#x27;频道已删除（原型）&#x27;));
        }
        if (action === &#x27;leave&#x27;) {
          openDialog(`退出 # ${conversation.channelName}？`,&#x27;退出后频道会从你的会话列表移除；需要管理员再次邀请才能加入。&#x27;,&#x27;退出频道&#x27;,() =&gt; removeChannel(chatId,&#x27;你已退出频道（原型）&#x27;));
        }
      }

      function updateSendButton() {
        sendButton.disabled = controls.state.value === &#x27;sending&#x27; || (composer.value.trim().length === 0 &amp;&amp; !attachmentDraft);
      }

      function toast(message) {
        const toastElement = root.querySelector(&#x27;.rc-toast&#x27;);
        clearTimeout(toastTimer);
        toastElement.textContent = message;
        toastElement.hidden = false;
        toastTimer = setTimeout(() =&gt; { toastElement.hidden = true; }, 2200);
      }

      function closeTransientMenus(except = &#x27;&#x27;) {
        if (except !== &#x27;add&#x27;) {
          root.querySelector(&#x27;#rc-add-menu&#x27;).hidden = true;
          root.querySelector(&#x27;#rc-add-trigger&#x27;).setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        }
        if (except !== &#x27;account&#x27;) {
          root.querySelector(&#x27;#rc-account-menu&#x27;).hidden = true;
          root.querySelector(&#x27;#rc-account-trigger&#x27;).setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        }
        if (except !== &#x27;emoji&#x27;) {
          root.querySelector(&#x27;#rc-emoji-picker&#x27;).hidden = true;
          root.querySelector(&#x27;#rc-emoji-trigger&#x27;).setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        }
        if (except !== &#x27;search&#x27;) {
          searchPopover.hidden = true;
          searchInput.setAttribute(&#x27;aria-expanded&#x27;,&#x27;false&#x27;);
          searchInput.removeAttribute(&#x27;aria-activedescendant&#x27;);
        }
        if (except !== &#x27;mention&#x27;) {
          mentionPicker.hidden = true;
          mentionItems = [];
          mentionContext = null;
        }
      }

      function openDialog(title, copy, confirmText, action, danger = true, field = null) {
        closeTransientMenus();
        root.querySelector(&#x27;#rc-dialog-title&#x27;).textContent = title;
        root.querySelector(&#x27;#rc-dialog-copy&#x27;).textContent = copy;
        const confirm = root.querySelector(&#x27;#rc-dialog-confirm&#x27;);
        confirm.textContent = confirmText;
        confirm.classList.toggle(&#x27;is-danger&#x27;, danger);
        const fieldElement = root.querySelector(&#x27;#rc-dialog-field&#x27;);
        const input = root.querySelector(&#x27;#rc-dialog-input&#x27;);
        dialogInputRequired = Boolean(field &amp;&amp; field.required);
        fieldElement.hidden = !field;
        if (field) {
          root.querySelector(&#x27;#rc-dialog-field-label&#x27;).textContent = field.label;
          input.value = field.value || &#x27;&#x27;;
          input.placeholder = field.placeholder || &#x27;&#x27;;
          confirm.disabled = dialogInputRequired &amp;&amp; !input.value.trim();
          setTimeout(() =&gt; { input.focus(); input.select(); }, 0);
        } else {
          input.value = &#x27;&#x27;;
          confirm.disabled = false;
        }
        dialogAction = action;
